name: loja
description: "ecremm - loja virtual em Flutter com Clean Architecture - Projeto Final (Atividade 5)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gestao de estado
  flutter_riverpod: ^2.5.1

  # Navegacao
  go_router: ^14.2.0

  # Consumo de API + modelagem JSON
  dio: ^5.4.3+1
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Persistencia local
  shared_preferences: ^2.3.0
  drift: ^2.19.1+1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilitarios de UI
  cached_network_image: ^3.4.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  drift_dev: ^2.19.1

flutter:
  uses-material-design: true
